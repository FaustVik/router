name: Code Quality

on:
  push:
    branches: [ main, develop, v2.0-alpha ]
  pull_request:
    branches: [ main, develop, v2.0-alpha ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, dom
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          php-${{ matrix.php-version }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run tests
      run: composer run test

    - name: Run PHPStan
      run: composer run phpstan

    - name: Run CS check
      run: composer run cs-check

    - name: Check for security vulnerabilities
      run: composer audit

  examples-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Test examples syntax
      run: find examples -name "*.php" -exec php -l {} \;

    - name: Test basic example
      run: REQUEST_URI="/" php examples/basic-example.php

    - name: Test DI examples
      run: |
        REQUEST_URI="/" php examples/di-basic-example.php
        REQUEST_URI="/products" php examples/di-external-container-example.php
        REQUEST_URI="/" php examples/di-middleware-example.php
